services:
  - type: web
    name: reelforge-marketing
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reelforge-marketing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reelforge-redis
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      # Required: protects /trigger, /keywords and /tasks (X-Admin-Key header)
      - key: ADMIN_API_KEY
        sync: false
      # Required: Brevo webhook secret (bearer token, X-Brevo-Webhook-Token header or basic-auth password)
      - key: BREVO_WEBHOOK_SECRET
        sync: false
      # Required before any outreach is sent (CAN-SPAM): full postal address for the email footer
      - key: COMPANY_POSTAL_ADDRESS
      # "false" pauses Partner Scout sequence emails and auto-enrollment (README → Pausing Partner Scout outreach)
      - key: PARTNER_SCOUT_AUTO_OUTREACH_ENABLED
        sync: false
      # Partner Intelligence (docs/rpi/DEPLOYMENT_RUNBOOK.md)
      - key: RPI_BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: RPI_ATTRIBUTION_HASH_SALT
        sync: false
      - key: RPI_PUBLIC_BASE_URL
        sync: false
      - key: RPI_TEST_RECIPIENTS
        sync: false
      - key: RPI_SIGNATURE_TITLE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CREATORDB_API_KEY
        sync: false
      - key: CREATORDB_USD_PER_CREDIT
        sync: false
      - key: CREATORDB_VERIFIED_ENDPOINTS
        sync: false
      - key: RPI_CREATORDB_SCORING_PERMITTED
        sync: false
      - key: SPARKTORO_API_KEY
        sync: false
      - key: SPARKTORO_USD_PER_CREDIT
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
      - key: SUPADATA_USD_PER_REQUEST
        sync: false
      - key: RPI_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RPI_STRIPE_PRICE_PLAN_MAP
        sync: false
      - key: POSTHOG_API_KEY
        sync: false

  - type: worker
    name: reelforge-worker
    runtime: docker
    plan: starter
    dockerCommand: celery -A celery_config worker --beat --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reelforge-marketing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reelforge-redis
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: BOUNCER_API_KEY
        sync: false
      - key: MIN_INSTAGRAM_FOLLOWERS
        sync: false
      - key: MIN_TIKTOK_FOLLOWERS
        sync: false
      # Outreach compliance: footer address and unsubscribe-link signing (must match the web service)
      - key: COMPANY_POSTAL_ADDRESS
        sync: false
      # "false" pauses Partner Scout sequence emails and auto-enrollment (README → Pausing Partner Scout outreach)
      - key: PARTNER_SCOUT_AUTO_OUTREACH_ENABLED
        sync: false
      - key: ADMIN_API_KEY
      # Partner Intelligence (docs/rpi/DEPLOYMENT_RUNBOOK.md)
      - key: RPI_BOOTSTRAP_ADMIN_KEY
        sync: false
      - key: RPI_ATTRIBUTION_HASH_SALT
        sync: false
      - key: RPI_PUBLIC_BASE_URL
        sync: false
      - key: RPI_TEST_RECIPIENTS
        sync: false
      - key: RPI_SIGNATURE_TITLE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CREATORDB_API_KEY
        sync: false
      - key: CREATORDB_USD_PER_CREDIT
        sync: false
      - key: CREATORDB_VERIFIED_ENDPOINTS
        sync: false
      - key: RPI_CREATORDB_SCORING_PERMITTED
        sync: false
      - key: SPARKTORO_API_KEY
        sync: false
      - key: SPARKTORO_USD_PER_CREDIT
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
      - key: SUPADATA_USD_PER_REQUEST
        sync: false
      - key: RPI_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RPI_STRIPE_PRICE_PLAN_MAP
        sync: false
      - key: POSTHOG_API_KEY
        sync: false

databases:
  - name: reelforge-marketing-db
    plan: starter

  - type: redis
    name: reelforge-redis
    plan: starter
